<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MuMain Web Client</title>
  <style>
    :root { --panel: rgba(10, 12, 20, .86); --line: rgba(255, 255, 255, .14); --gold: #c9a24a; --text: #e6e8ef; --muted: #9aa0b2; --error: #ef7a6c; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; background: #0a0d14; color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #stage { position: fixed; inset: 0; }
    #view { width: 100%; height: 100%; display: block; }
    .hud { position: fixed; left: 12px; right: 12px; top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; }
    .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-variant-numeric: tabular-nums; }
    .chip label, .chip select { pointer-events: auto; }
    select, input { background: #151a26; color: inherit; border: 1px solid #2c3446; border-radius: 4px; padding: 6px 8px; font: inherit; }
    #loading { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); width: min(520px, 86vw); }
    #track { height: 4px; background: rgba(255, 255, 255, .12); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    #bar { height: 100%; width: 0; background: var(--gold); transition: width .2s; }
    body.ready #track { display: none; }
    #login { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, #1a1f2e 0%, #07090f 70%); }
    .panel { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 14px; }
    .panel h1 { margin: 0; font-size: 20px; letter-spacing: .04em; color: var(--gold); }
    fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
    .row { display: grid; gap: 4px; }
    .row label { color: var(--muted); font-size: 12px; }
    .split { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
    details summary { color: var(--muted); cursor: pointer; font-size: 12px; }
    details[open] { display: grid; gap: 10px; }
    .buttons { display: flex; gap: 8px; }
    button { font: inherit; border-radius: 6px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: #1b2131; color: var(--text); }
    button.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: 600; flex: 1; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
    .choices { display: grid; gap: 6px; }
    .choice { text-align: left; display: flex; justify-content: space-between; gap: 8px; }
    .choice small { color: var(--muted); }
    #loginError { color: var(--error); margin: 0; }
    .hint { color: var(--muted); font-size: 12px; margin: 0; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .label { position: absolute; left: 0; top: 0; font-size: 12px; white-space: nowrap; color: #f2f3f7; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
    .label.npc { color: #9fe0a8; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="stage"><canvas id="view"></canvas></div>
  <div id="labels"></div>
  <div class="hud" id="hud" hidden>
    <span class="chip" id="heroName">-</span>
    <span class="chip">Cell <span id="position">-</span></span>
    <span class="chip" id="fps">- fps</span>
    <span class="chip" id="bodySetChip" hidden><label for="bodySet">Body set </label>
      <select id="bodySet">
        <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option>
        <option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option>
      </select>
    </span>
  </div>
  <div id="login">
    <form class="panel" id="loginForm" autocomplete="on">
      <h1>MU Online</h1>
      <fieldset>
        <div class="row"><label for="username">Account</label><input id="username" name="username" required maxlength="10" autocomplete="username"></div>
        <div class="row"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="20" autocomplete="current-password"></div>
        <details>
          <summary>Server</summary>
          <div class="split">
            <div class="row"><label for="host">Connect server</label><input id="host" name="host" required></div>
            <div class="row"><label for="port">Port</label><input id="port" name="port" type="number" min="1" max="65535" required></div>
          </div>
          <div class="row"><label for="relay">Relay</label><input id="relay" name="relay" required></div>
        </details>
        <div class="buttons">
          <button class="primary" type="submit">Connect</button>
          <button type="button" id="offline">Explore offline</button>
        </div>
      </fieldset>
      <p id="loginError" role="alert" hidden></p>
      <div class="choices" id="servers" hidden></div>
      <div class="choices" id="characters" hidden></div>
      <p class="hint">OpenMU's test accounts use the account name as password, e.g. test300.</p>
    </form>
  </div>
  <div id="loading" class="chip"><div id="status">Log in to an OpenMU server, or explore Lorencia offline.</div><div id="track"><div id="bar"></div></div></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
