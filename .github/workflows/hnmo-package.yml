name: HNMO package

# Builds the HNMO folder for Windows (game server + admin panel + web client + game
# data) and offers it as a download on the run's page.
on:
  workflow_dispatch:
  push:
    branches: [claude/magical-goldberg-hsbtda]
    paths: ['web/**', '.github/workflows/hnmo-package.yml']

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/MOnline
          ref: claude/magical-goldberg-hsbtda
          path: server
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the web client's library
        run: npm ci --prefix client/web
      - name: Build the HNMO folder
        run: client/web/tools/package-hnmo.sh "$GITHUB_WORKSPACE/server" win-x64 "$GITHUB_WORKSPACE/HNMO"
      - uses: actions/upload-artifact@v4
        with:
          name: HNMO-windows
          path: HNMO
          retention-days: 14
